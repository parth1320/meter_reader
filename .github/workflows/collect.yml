name: collect-meter-data

on:
  schedule:
    - cron: "7 */2 * * *"   # every 2 hours (the portal allows a fresh real-time read every 6h)
  workflow_dispatch:

concurrency: collect

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install -r collector/requirements.txt
          playwright install --with-deps chromium
      - name: Collect
        env:
          PORTAL_USER: ${{ secrets.PORTAL_USER }}
          PORTAL_PASS: ${{ secrets.PORTAL_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python collector/collect.py
      - name: Upload login screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: login-debug
          path: login_failed.png
          if-no-files-found: ignore
