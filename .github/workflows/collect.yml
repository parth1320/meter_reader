name: collect-meter-data

on:
  # Scheduled runs are off: the portal's reCAPTCHA rejects the headless login from GitHub's servers
  # ("Invalid Captcha"). Collection runs on your PC instead (collector/local.py).
  workflow_dispatch:

concurrency: collect

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install -r collector/requirements.txt
          playwright install --with-deps chromium
      - name: Collect
        env:
          PORTAL_USER: ${{ secrets.PORTAL_USER }}
          PORTAL_PASS: ${{ secrets.PORTAL_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python collector/collect.py
      - name: Upload login screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: login-debug
          path: login_failed.png
          if-no-files-found: ignore
